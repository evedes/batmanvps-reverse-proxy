services:
  nginx:
    image: batman-reverseproxy:latest
    build: ./logging
    container_name: nginx-reverseproxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./ssl/eduardovedes:/etc/nginx/ssl/eduardovedes
      - ./ssl/atomize:/etc/nginx/ssl/atomize
      - ./ssl/minio:/etc/nginx/ssl/minio
      - ./ssl/zyker:/etc/nginx/ssl/zyker
      - ./ssl/getkinfolio:/etc/nginx/ssl/getkinfolio
      - ./ssl/getkinfolio.staging:/etc/nginx/ssl/getkinfolio.staging
      - ./ssl/onedevarmy:/etc/nginx/ssl/onedevarmy
      - ./ssl/onedevarmy.analytics:/etc/nginx/ssl/onedevarmy.analytics
      - ./ssl/schola:/etc/nginx/ssl/schola
      - ./ssl/bicodobra:/etc/nginx/ssl/bicodobra
      - ./ssl/rhizo:/etc/nginx/ssl/rhizo
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - batmanvps
networks:
  batmanvps:
    external: true
