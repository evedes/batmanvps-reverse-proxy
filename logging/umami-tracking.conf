# Umami analytics, first-party (see batmanvps-umami), included in the HTTPS
# server block of every tracked site in nginx.conf. The tracker loaded from
# /a/script.js posts to /a/api/send on the site's own origin, so ad blockers
# and the app's CSP see only 'self'. SECURITY INVARIANT: exactly these two paths
# (anchored regex, mapped by $umami_path) — never a /a/ prefix, which would
# expose Umami's login and admin API on the site.
location ~ ^/a/(script\.js|api/send)$ {
  # The tracked sites are behind Cloudflare: take the visitor IP from
  # CF-Connecting-IP, but only when the connection really comes from
  # Cloudflare (https://www.cloudflare.com/ips/, checked 2026-10-10), so a
  # direct hit on batman cannot fake it. Scoped to this location so the app
  # itself keeps seeing the connecting address.
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header CF-Connecting-IP;

  set $upstream_umami_tracking http://batmanvps-umami:3000;
  proxy_pass $upstream_umami_tracking$umami_path;
  proxy_set_header Host $host;
  # Always overwritten; Umami reads only X-Real-IP (CLIENT_IP_HEADER=x-real-ip).
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;

  proxy_connect_timeout 2s;
  proxy_read_timeout 10s;
}
